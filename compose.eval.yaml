x-evaluation-service: &evaluation-service
  env_file: !override
    - ${RAG_KB_EVAL_ENV_FILE:?evaluation runtime env file is required}
  pull_policy: never
  labels:
    rag-kb.evaluation-owner: ${RAG_KB_EVAL_OWNER:?evaluation owner is required}

services:
  postgres:
    pull_policy: never
    labels:
      rag-kb.evaluation-owner: ${RAG_KB_EVAL_OWNER:?evaluation owner is required}

  falkordb:
    pull_policy: never
    environment:
      # The frozen seed contains an RDB, not an AOF directory. Redis prefers
      # even an empty AOF over the RDB when appendonly is enabled.
      REDIS_ARGS: "--appendonly no"
    labels:
      rag-kb.evaluation-owner: ${RAG_KB_EVAL_OWNER:?evaluation owner is required}

  storage-init:
    <<: *evaluation-service
    image: rag-kb-app:eval
    volumes:
      - ${RAG_KB_EVAL_RUNTIME_ROOT:?evaluation runtime root is required}/logs:/var/log/rag-kb

  migrate:
    <<: *evaluation-service
    image: rag-kb-app:eval

  maintenance:
    <<: *evaluation-service
    image: rag-kb-app:eval
    volumes:
      - ${RAG_KB_EVAL_RUNTIME_ROOT:?evaluation runtime root is required}/logs:/var/log/rag-kb

  api:
    <<: *evaluation-service
    image: rag-kb-app:eval
    volumes:
      - ${RAG_KB_EVAL_RUNTIME_ROOT:?evaluation runtime root is required}/logs:/var/log/rag-kb

  worker:
    <<: *evaluation-service
    image: rag-kb-app:eval
    volumes:
      - ${RAG_KB_EVAL_RUNTIME_ROOT:?evaluation runtime root is required}/logs:/var/log/rag-kb

  frontend:
    image: rag-kb-user-frontend:eval
    pull_policy: never
    labels:
      rag-kb.evaluation-owner: ${RAG_KB_EVAL_OWNER:?evaluation owner is required}

volumes:
  postgres-data:
    labels:
      rag-kb.evaluation-owner: ${RAG_KB_EVAL_OWNER:?evaluation owner is required}
  source-data:
    labels:
      rag-kb.evaluation-owner: ${RAG_KB_EVAL_OWNER:?evaluation owner is required}
  inference-model-cache:
    labels:
      rag-kb.evaluation-owner: ${RAG_KB_EVAL_OWNER:?evaluation owner is required}
  model-secrets:
    labels:
      rag-kb.evaluation-owner: ${RAG_KB_EVAL_OWNER:?evaluation owner is required}
  falkordb-data:
    labels:
      rag-kb.evaluation-owner: ${RAG_KB_EVAL_OWNER:?evaluation owner is required}

networks:
  default:
    labels:
      rag-kb.evaluation-owner: ${RAG_KB_EVAL_OWNER:?evaluation owner is required}
