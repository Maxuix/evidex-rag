[project]
name = "rag-kb"
version = "0.1.0"
description = "Local knowledge base and evidence-grounded RAG application"
readme = "README.md"
requires-python = "==3.12.13"
dependencies = [
  "alembic==1.18.5",
  "asyncpg==0.31.0",
  "docling[rapidocr]==2.114.0",
  "docling-core==2.87.1",
  "fastapi==0.135.4",
  "greenlet==3.5.3",
  "langchain-core==1.4.9",
  "langchain-openai==1.3.5",
  "langgraph==1.2.9",
  "pgvector==0.4.2",
  "pillow==12.3.0",
  "pypdf==6.14.2",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "SQLAlchemy==2.0.51",
  "torch==2.10.0",
  "torchvision==0.25.0",
  "uvicorn==0.51.0",
]

# Fixtures and local tools only. These never enter the runtime image, which
# installs requirements.lock, but a clean checkout needs them to run the suites.
[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "openpyxl==3.1.5",
  "python-docx==1.2.0",
  "python-pptx==1.0.2",
  "PyYAML==6.0.3",
]

[tool.uv]
package = false
