<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="Evidex — local knowledge base: documents in, cited answers out">
  <title>Evidex — documents in, cited answers out</title>
  <defs>
    <pattern id="dotgrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#161B22"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3B434E"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D29922"/>
    </marker>
  </defs>

  <!-- panel -->
  <rect x="0" y="0" width="1200" height="360" rx="16" fill="#0D1117"/>
  <rect x="0" y="0" width="1200" height="360" rx="16" fill="url(#dotgrid)"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="16" fill="none" stroke="#21262D"/>

  <!-- left: identity -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="102" font-size="16" letter-spacing="3.5" fill="#3FB9A4">LOCAL-FIRST · SINGLE-USER · EVIDENCE-GROUNDED</text>
    <text x="70" y="176" font-size="66" font-weight="700" fill="#E6EDF3">EVI<tspan fill="#58A6FF">DEX</tspan></text>
    <text x="72" y="226" font-size="26" fill="#E6EDF3">Documents in. <tspan fill="#3FB950" font-weight="600">Cited answers</tspan> out.</text>
    <text x="72" y="264" font-size="17" fill="#8B949E">FastAPI · PostgreSQL + pgvector · Graphiti + FalkorDB · React</text>

    <!-- chat mode chips -->
    <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="16">
      <rect x="72" y="290" width="76" height="34" rx="17" fill="#161B22" stroke="#30363D"/>
      <text x="110" y="312" text-anchor="middle" fill="#8B949E">text</text>
      <rect x="160" y="290" width="80" height="34" rx="17" fill="#12261E" stroke="#3FB950"/>
      <text x="200" y="312" text-anchor="middle" fill="#3FB950">auto</text>
      <rect x="252" y="290" width="84" height="34" rx="17" fill="#161B22" stroke="#30363D"/>
      <text x="294" y="312" text-anchor="middle" fill="#8B949E">graph</text>
    </g>
  </g>

  <!-- right: pipeline -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- retry arc above -->
    <path d="M 964 128 C 964 92, 822 92, 822 128" fill="none" stroke="#2D333B" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
    <text x="893" y="86" font-size="14" text-anchor="middle" fill="#6E7681">retrieve again</text>

    <!-- node 1: documents -->
    <rect x="626" y="130" width="108" height="92" rx="12" fill="#161B22" stroke="#30363D"/>
    <g transform="translate(658 146)">
      <path d="M0 0 h30 l14 14 v48 h-44 z" fill="#0D1117" stroke="#58A6FF" stroke-width="2"/>
      <path d="M30 0 v14 h14" fill="none" stroke="#58A6FF" stroke-width="2"/>
      <line x1="8" y1="26" x2="36" y2="26" stroke="#58A6FF" stroke-width="3" stroke-linecap="round"/>
      <line x1="8" y1="36" x2="36" y2="36" stroke="#2F5E8F" stroke-width="3" stroke-linecap="round"/>
      <line x1="8" y1="46" x2="28" y2="46" stroke="#2F5E8F" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="680" y="252" font-size="18" text-anchor="middle" fill="#E6EDF3">Documents</text>
    <text x="680" y="274" font-size="13.5" text-anchor="middle" fill="#8B949E">TXT · MD · PDF · Office</text>

    <line x1="740" y1="176" x2="762" y2="176" stroke="#3B434E" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- node 2: indexes -->
    <rect x="768" y="130" width="108" height="92" rx="12" fill="#161B22" stroke="#30363D"/>
    <g transform="translate(786 146)">
      <circle cx="6" cy="6" r="3.4" fill="#3FB9A4"/>
      <circle cx="24" cy="2" r="3.4" fill="#3FB9A4"/>
      <circle cx="42" cy="8" r="3.4" fill="#3FB9A4"/>
      <circle cx="14" cy="20" r="3.4" fill="#2C7A6B"/>
      <circle cx="34" cy="22" r="3.4" fill="#2C7A6B"/>
      <circle cx="52" cy="18" r="3.4" fill="#3FB9A4"/>
      <line x1="0" y1="38" x2="52" y2="38" stroke="#58A6FF" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="48" x2="44" y2="48" stroke="#2F5E8F" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="58" x2="52" y2="58" stroke="#2F5E8F" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="68" x2="34" y2="68" stroke="#2F5E8F" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="822" y="252" font-size="18" text-anchor="middle" fill="#E6EDF3">Indexes</text>
    <text x="822" y="274" font-size="13.5" text-anchor="middle" fill="#8B949E">pgvector · FTS</text>

    <line x1="882" y1="176" x2="904" y2="176" stroke="#3B434E" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- node 3: agent loop -->
    <rect x="910" y="130" width="108" height="92" rx="12" fill="#161B22" stroke="#30363D"/>
    <g transform="translate(964 176)">
      <path d="M -8 -24.5 A 26 26 0 0 1 22.5 13" fill="none" stroke="#D29922" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowOrange)"/>
      <path d="M 8 24.5 A 26 26 0 0 1 -22.5 -13" fill="none" stroke="#D29922" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowOrange)"/>
      <circle cx="0" cy="0" r="5.5" fill="#3FB9A4"/>
    </g>
    <text x="964" y="252" font-size="18" text-anchor="middle" fill="#E6EDF3">Native Agent</text>
    <text x="964" y="274" font-size="14" text-anchor="middle" fill="#8B949E">tool-calling loop</text>

    <line x1="1024" y1="176" x2="1046" y2="176" stroke="#3B434E" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- node 4: cited answer -->
    <rect x="1052" y="130" width="108" height="92" rx="12" fill="#12261E" stroke="#3FB950"/>
    <g transform="translate(1068 148)">
      <line x1="0" y1="2" x2="72" y2="2" stroke="#E6EDF3" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="14" x2="60" y2="14" stroke="#8B949E" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="26" x2="66" y2="26" stroke="#8B949E" stroke-width="3" stroke-linecap="round"/>
      <rect x="0" y="38" width="30" height="22" rx="6" fill="#0D1117" stroke="#3FB950" stroke-width="1.5"/>
      <text x="15" y="54" font-size="14" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" fill="#3FB950">1</text>
      <rect x="38" y="38" width="30" height="22" rx="6" fill="#0D1117" stroke="#3FB950" stroke-width="1.5"/>
      <text x="53" y="54" font-size="14" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" fill="#3FB950">2</text>
    </g>
    <text x="1106" y="252" font-size="18" text-anchor="middle" fill="#E6EDF3">Answer</text>
    <text x="1106" y="274" font-size="14" text-anchor="middle" fill="#8B949E">inline citations</text>

    <!-- optional graph lane under indexes -->
    <path d="M 822 222 L 822 316 L 964 316 L 964 226" fill="none" stroke="#2D333B" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
    <g transform="translate(856 290)">
      <circle cx="0" cy="10" r="5" fill="#D29922"/>
      <circle cx="36" cy="0" r="5" fill="#D29922"/>
      <circle cx="72" cy="12" r="5" fill="#D29922"/>
      <line x1="4" y1="7" x2="32" y2="2" stroke="#8A6420" stroke-width="2"/>
      <line x1="40" y1="3" x2="68" y2="10" stroke="#8A6420" stroke-width="2"/>
    </g>
    <text x="893" y="330" font-size="14" text-anchor="middle" fill="#6E7681">+ Graphiti relations lane</text>
  </g>
</svg>
