x-runtime-environment: &runtime-environment
  RAG_KB__DATABASE__RUNTIME_DSN: postgresql+asyncpg://rag_kb_runtime:${RAG_KB_RUNTIME_PASSWORD:-replace-locally}@postgres:5432/rag_kb
  RAG_KB__DATABASE__MIGRATION_DSN: postgresql+asyncpg://rag_kb_migration:not-available@migration-disabled.invalid/rag_kb
  RAG_KB__SECURITY__ALLOWED_CORS_ORIGINS: '["http://127.0.0.1:${RAG_KB_FRONTEND_PORT:-3000}","http://localhost:${RAG_KB_FRONTEND_PORT:-3000}","http://127.0.0.1:5173","http://localhost:5173"]'
  RAG_KB__OBSERVABILITY__LOG_DIRECTORY: /var/log/rag-kb
  GRAPHITI_TELEMETRY_ENABLED: "false"
  RAG_KB__GRAPHITI__HOST: falkordb
  RAG_KB__GRAPHITI__PORT: "6379"

x-local-logging: &local-logging
  driver: local
  options:
    max-size: "20m"
    max-file: "5"

x-app-image: &app-image
  image: rag-kb-app:local
  build:
    context: .
    dockerfile: Dockerfile
    additional_contexts:
      model-assets: ${RAG_KB_BUILD_MODEL_ASSET_CONTEXT:-docker-image://docker.io/library/python:3.12.13-slim-bookworm@sha256:8a7e7cc04fd3e2bd787f7f24e22d5d119aa590d429b50c95dfe12b3abe52f48b}
    args:
      RAG_KB_BUILD_REVISION: ${RAG_KB_BUILD_REVISION:-unknown}
      RAG_KB_BUILD_DEBIAN_MIRROR: ${RAG_KB_BUILD_DEBIAN_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/debian}
      RAG_KB_BUILD_PYPI_INDEX_URL: ${RAG_KB_BUILD_PYPI_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
      RAG_KB_BUILD_HF_ENDPOINT: ${RAG_KB_BUILD_HF_ENDPOINT:-https://hf-mirror.com}

x-user-frontend-image: &user-frontend-image
  image: rag-kb-user-frontend:local
  build:
    context: ./apps/web-chat
    dockerfile: Dockerfile
    target: ${RAG_KB_BUILD_FRONTEND_TARGET:-runtime}
    additional_contexts:
      frontend-dist: ${RAG_KB_BUILD_FRONTEND_DIST_CONTEXT:-./apps/web-chat/public}
    args:
      RAG_KB_BUILD_REVISION: ${RAG_KB_BUILD_REVISION:-unknown}
      RAG_KB_BUILD_NPM_REGISTRY: ${RAG_KB_BUILD_NPM_REGISTRY:-https://registry.npmmirror.com}

x-runtime-service: &runtime-service
  <<: *app-image
  env_file:
    - .env.local
  environment: *runtime-environment
  depends_on:
    postgres:
      condition: service_healthy
    falkordb:
      condition: service_healthy
    storage-init:
      condition: service_completed_successfully
  logging: *local-logging

services:
  falkordb:
    # Pinned FalkorDB 4.20.3 (multi-arch amd64/arm64, verified digest 2026-08-14).
    # AOF is enabled explicitly (appendonly yes) so episode graphs survive
    # container restarts; state lives on the named volume below.
    image: docker.io/falkordb/falkordb:v4.20.3@sha256:05b3645c78c881a967c7d6b6ab4a8a2f461caf42962d38274aa116658195ad3d
    environment:
      # The image entrypoint builds the server command from REDIS_ARGS; AOF is
      # enabled explicitly so episode graphs survive container restarts.
      REDIS_ARGS: "--appendonly yes"
    ports:
      - 127.0.0.1:${RAG_KB_FALKORDB_PORT:-6379}:6379
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    logging: *local-logging

  postgres:
    image: docker.io/pgvector/pgvector:0.8.2-pg18-bookworm@sha256:42e7f6b4e1eceb02ff14e3e6bc6108bbe259abbe83879dc1845d0da1ddeb555d
    environment:
      POSTGRES_DB: rag_kb
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-replace-locally}
      RAG_KB_MIGRATION_PASSWORD: ${RAG_KB_MIGRATION_PASSWORD:-replace-locally}
      RAG_KB_RUNTIME_PASSWORD: ${RAG_KB_RUNTIME_PASSWORD:-replace-locally}
    ports:
      - 127.0.0.1:${RAG_KB_POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/postgres/init-runtime.sh:/docker-entrypoint-initdb.d/10-init-runtime.sh:ro
      - ./deploy/postgres/bootstrap-roles.sql:/opt/rag-kb/bootstrap-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_kb"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    logging: *local-logging

  storage-init:
    <<: *app-image
    user: "0:0"
    command:
      - /bin/sh
      - -c
      - install -d -o 10001 -g 10001 /var/lib/rag-kb/sources/staging /var/lib/rag-kb/sources/final /var/lib/rag-kb/sources/asset-staging /var/lib/rag-kb/sources/assets /var/lib/rag-kb/sources/parser-temp /var/lib/rag-kb/sources/.worker-runtime /var/lib/rag-kb/model-cache/huggingface && install -d -m 0700 -o 10001 -g 10001 /var/lib/rag-kb/model-secrets /var/log/rag-kb
    depends_on: {}
    volumes:
      - source-data:/var/lib/rag-kb/sources
      - inference-model-cache:/var/lib/rag-kb/model-cache
      - model-secrets:/var/lib/rag-kb/model-secrets
      - ./.runtime/logs:/var/log/rag-kb
    restart: "no"
    logging: *local-logging

  migrate:
    <<: *app-image
    profiles: ["tools"]
    environment:
      RAG_KB__DATABASE__MIGRATION_DSN: postgresql+asyncpg://rag_kb_migration:${RAG_KB_MIGRATION_PASSWORD:-replace-locally}@postgres:5432/rag_kb
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *local-logging

  maintenance:
    <<: *runtime-service
    profiles: ["tools"]
    entrypoint: ["python", "-m", "apps.maintenance.main"]
    command: ["cleanup"]
    volumes:
      - source-data:/var/lib/rag-kb/sources
      - ./.runtime/logs:/var/log/rag-kb
    restart: "no"

  api:
    <<: *runtime-service
    command: ["python", "-m", "apps.api.main", "--container-listen"]
    ports:
      - 127.0.0.1:${RAG_KB_API_PORT:-8000}:8000
    volumes:
      - source-data:/var/lib/rag-kb/sources
      - model-secrets:/var/lib/rag-kb/model-secrets
      - ./.runtime/logs:/var/log/rag-kb
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).read()"
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s
    restart: unless-stopped

  worker:
    <<: *runtime-service
    command: ["python", "-m", "apps.worker.main"]
    mem_limit: 6g
    pids_limit: 256
    volumes:
      - source-data:/var/lib/rag-kb/sources
      - inference-model-cache:/var/lib/rag-kb/model-cache
      - model-secrets:/var/lib/rag-kb/model-secrets:ro
      - ./.runtime/logs:/var/log/rag-kb
    healthcheck:
      # A cheap liveness heartbeat gate runs before the full dependency check.
      # Fresh Workers still pay the native Docling import cost (~7s).
      test: ["CMD", "python", "-m", "apps.worker.main", "--check"]
      interval: 10s
      timeout: 20s
      retries: 3
      start_period: 240s
    restart: unless-stopped

  frontend:
    <<: *user-frontend-image
    command:
      - python
      - /app/server.py
      - --api-base-url
      - http://127.0.0.1:${RAG_KB_API_PORT:-8000}/api/v1
    ports:
      - 127.0.0.1:${RAG_KB_FRONTEND_PORT:-3000}:3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=2).read()"
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s
    restart: unless-stopped
    logging: *local-logging

volumes:
  falkordb-data:
  postgres-data:
  source-data:
  inference-model-cache:
  model-secrets:
